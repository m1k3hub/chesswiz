name: CI

on:
  push:
    branches: [main, master]
    paths:
      - "opening-report/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "opening-report/**"
      - ".github/workflows/ci.yml"

defaults:
  run:
    working-directory: opening-report

jobs:
  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: opening-report/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests (including jsdom e2e)
        run: npx vitest run

      - name: Build
        run: npm run build

  backend:
    name: Backend (pytest contract tests)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scidb
          POSTGRES_PASSWORD: scidb
          POSTGRES_DB: scidb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scidb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgresql://scidb:scidb@localhost:5432/scidb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Runtime adapter contract tests
        run: pytest tests/test_runtime_adapter.py tests/test_adapter_contract.py -v

      - name: Store tests (MemoryStore + Redis + PostgreSQL)
        run: pytest tests/test_store.py -v

      - name: Tcl bridge contract tests (skipped without TCL_BRIDGE_PATH)
        run: pytest tests/test_tcl_bridge_contract.py -v

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: opening-report/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install backend deps
        run: pip install -r requirements.txt

      - name: Start backend (adapter on :5001)
        run: |
          (env -u REDIS_URL -u DATABASE_URL python -m uvicorn runtime_adapter:app \
            --host 127.0.0.1 --port 5001 --log-level warning > /tmp/backend.log 2>&1 &) ;
          sleep 4 ;
          curl -sf http://127.0.0.1:5001/api/health > /dev/null

      - name: Start dev server (proxies /api to :5001)
        run: |
          (env VITE_SCIDB_PLAY_WS=1 npx vite --host 127.0.0.1 --port 8765 > /tmp/vite.log 2>&1 &) ;
          sleep 5 ;
          curl -sf http://localhost:8765/ > /dev/null

      - name: Run Playwright tests
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8765