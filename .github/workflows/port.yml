name: Chesswiz ports
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential tcl8.6-dev tk8.6-dev tcllib tcl-tls \
            libfreetype6-dev libsm-dev libglu1-mesa-dev desktop-file-utils libxcursor-dev libfontconfig1-dev libgdbm-dev \
            libx11-dev libxft-dev libxext-dev zlib1g-dev libexpat1-dev libmpv-dev xvfb xauth
      - run: ./configure
      # The full build (src, engines, man pages, Tcl bundle), as a user would.
      - run: make -C engines/stockfish/src net   # NNUE is too big for git
      - run: make -j4
      # The app tests run against the installed share files.
      - run: sudo make install
      - run: xvfb-run -a make -C tests tcl
      # The outer Xvfb supplies DISPLAY; suppress the Makefile's nested Xvfb.
      - run: xvfb-run -a make -C tests app-tcl XVFB_RUN=
  windows-cross:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y tcl8.6 patch make curl xz-utils llvm && ls -d /usr/lib/llvm-*/bin | tail -1 >> "$GITHUB_PATH"
      - name: Install pinned Zig (archive checksum in .zig-sha256)
        # The pinned dev build is gone from ziglang.org; the exact archive is
        # an asset of the release named by the repository variable
        # ZIG_RELEASE_TAG (the repository is private, so fetch it with gh).
        env:
          GH_TOKEN: ${{ github.token }}
          ZIG_RELEASE_TAG: ${{ vars.ZIG_RELEASE_TAG }}
        run: |
          test -n "$ZIG_RELEASE_TAG" || { echo "repository variable ZIG_RELEASE_TAG is not set"; exit 1; }
          mkdir -p build/zig
          gh release download "$ZIG_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'zig-*.tar.xz' --output build/zig/archive.tar.xz
          echo "$(cat .zig-sha256)  build/zig/archive.tar.xz" | sha256sum -c
          tar xf build/zig/archive.tar.xz -C build/zig --strip-components=1
          test "$(build/zig/zig version)" = "$(cat .zig-version)"
          echo "$PWD/build/zig" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: build/src
          key: sysroot-sources-${{ runner.os }}-${{ hashFiles('scripts/sysroot-pins.sh') }}
      - run: scripts/build-sysroot.sh x86_64-windows-gnu
      - name: Configure and build Windows
        run: |
          sysroot="$PWD/build/x86_64-windows-gnu"
          ./configure --toolchain=zig --target=x86_64-windows-gnu \
            --tcl-includes="$sysroot/include" --tk-includes="$sysroot/include" \
            --tcl-libraries="$sysroot/lib" --tk-libraries="$sysroot/lib" MEDIA_BACKEND=mf
          make -C src -j2
          make -C tcl
          make -C engines/stockfish/src net   # NNUE is too big for git
          scripts/build-windows-engines.sh
          scripts/make-windows-dist.sh .
      - uses: actions/upload-artifact@v4
        with:
          name: Chesswiz-windows
          path: build/dist/Chesswiz
          if-no-files-found: error
  windows-test:
    runs-on: windows-latest
    needs: windows-cross
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Chesswiz-windows
          path: build/dist/Chesswiz
      - name: Launch bundled application
        shell: pwsh
        run: |
          $bundle = (Resolve-Path build/dist/Chesswiz).Path
          $script = (Resolve-Path tests/smoke/launch-smoke.tcl).Path
          $result = Join-Path $env:RUNNER_TEMP 'smoke-ok.txt'
          $env:SCIDB_USERDIR = Join-Path $env:RUNNER_TEMP 'chesswiz-user'
          $env:SCIDB_SHAREDIR = $bundle
          $env:TCL_LIBRARY = Join-Path $bundle 'lib/tcl8.6'
          $env:TK_LIBRARY = Join-Path $bundle 'lib/tk8.6'
          Remove-Item $result -ErrorAction SilentlyContinue
          $arguments = '-encoding utf-8 "{0}" "{1}" "{2}"' -f $script, (Join-Path $bundle 'chesswiz.tcl'), $result
          $process = Start-Process (Join-Path $bundle 'tkchesswiz.exe') -ArgumentList $arguments -PassThru
          if (-not $process.WaitForExit(90000)) {
            Stop-Process -Id $process.Id -Force
            throw 'Application smoke test timed out'
          }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $result)) { throw 'Application smoke test failed' }
          if ((Get-Content $result -Raw).Trim() -ne 'OK') { throw 'Missing smoke OK' }
      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          # A release tag vX.Y.Z names the version; other builds are 0.9.<run>.
          $version = "0.9.${{ github.run_number }}"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -match '^v(\d+\.\d+\.\d+)$') { $version = $Matches[1] }
          & $iscc /Q "/DSrcDir=$((Resolve-Path build/dist/Chesswiz).Path)" "/DRootDir=$PWD" "/DAppVersion=$version" "/O$PWD\build\installer" scripts\chesswiz.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          Get-ChildItem build\installer
      - uses: actions/upload-artifact@v4
        with:
          name: Chesswiz-windows-installer
          path: build/installer/*.exe
          if-no-files-found: error
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14        # Apple Silicon
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CHESSWIZ_SIGN_ID: ${{ secrets.CHESSWIZ_SIGN_ID }}
      NOTARY_APPLE_ID: ${{ secrets.CHESSWIZ_NOTARY_APPLE_ID }}
      NOTARY_PASSWORD: ${{ secrets.CHESSWIZ_NOTARY_PASSWORD }}
      NOTARY_TEAM_ID: ${{ secrets.CHESSWIZ_NOTARY_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: build/src
          key: sysroot-sources-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('scripts/sysroot-pins.sh') }}
      - name: Build Aqua runtime, TLS, app and engines
        run: |
          scripts/build-macos-runtime.sh "$PWD/build/macos-sysroot"
          scripts/build-macos-tls.sh "$PWD/build/macos-sysroot" ${{ matrix.arch }}
          scripts/build-macos-app-binary.sh "$PWD" "$PWD/build/macos-sysroot" ${{ matrix.arch }}
          make -C tcl
          make -C engines/stockfish/src net   # NNUE is too big for git
          SF_ARCHS=${{ matrix.arch }} scripts/build-macos-engines.sh
      - name: Version (release tag vX.Y.Z, else 0.9.<run>)
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "CHESSWIZ_VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          else
            echo "CHESSWIZ_VERSION=0.9.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi
      - name: Assemble ad-hoc signed app and DMG
        if: env.CHESSWIZ_SIGN_ID == ''
        run: scripts/make-macos-app.sh . "$PWD/build/dist/Chesswiz.app" "$PWD/build/macos-sysroot"
      # Secrets cannot be referenced directly in step if expressions.
      # A Developer ID certificate/private key must already be in the runner keychain.
      - name: Assemble Developer ID signed app and DMG
        if: env.CHESSWIZ_SIGN_ID != ''
        run: scripts/make-macos-app.sh . "$PWD/build/dist/Chesswiz.app" "$PWD/build/macos-sysroot"
      - name: Smoke test through app launcher
        run: |
          export CW_STARTUP_HARNESS="$PWD/tests/smoke/launch-smoke.tcl"
          export CW_LOGDIR="$PWD/build/smoke-logs"
          export SCIDB_USERDIR="$RUNNER_TEMP/chesswiz-user"
          python3 - <<'PY'
          import os, pathlib, subprocess
          result = pathlib.Path(os.environ['RUNNER_TEMP']) / 'smoke-ok.txt'
          result.unlink(missing_ok=True)
          try:
              subprocess.run(['build/dist/Chesswiz.app/Contents/MacOS/chesswiz', str(result)],
                             timeout=90, check=True)
              assert result.read_text().strip() == 'OK', 'Missing smoke OK'
          finally:
              for log in pathlib.Path('build/smoke-logs').glob('*.log'):
                  print(log.read_text(errors='replace'))
          PY
      - name: Notarize and staple DMG
        if: env.CHESSWIZ_SIGN_ID != '' && env.NOTARY_APPLE_ID != '' && env.NOTARY_PASSWORD != '' && env.NOTARY_TEAM_ID != ''
        run: |
          xcrun notarytool submit build/dist/Chesswiz.dmg --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" --team-id "$NOTARY_TEAM_ID" --wait --output-format json > build/notary.json
          python3 -c 'import json; assert json.load(open("build/notary.json"))["status"] == "Accepted"'
          xcrun stapler staple build/dist/Chesswiz.dmg
          xcrun stapler validate build/dist/Chesswiz.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Chesswiz-macos-${{ matrix.arch }}
          path: build/dist/Chesswiz.dmg
          if-no-files-found: error
